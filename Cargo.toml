[package]
name = "custom-logger"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["std"] }
colored = "2"

[lib]
name = "custom_logger"
path = "src/lib.rs"
